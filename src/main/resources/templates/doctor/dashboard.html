<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - C7 Smile Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0d9b7a; --primary-dark: #0a6e5c; --primary-light: #14b895; --sidebar-bg: #1a1d23; --sidebar-active: rgba(13,155,122,0.15); }
        body { font-family:'Inter',sans-serif; background:#f4f7fa; margin:0; }
        .sidebar { min-height:100vh; background:var(--sidebar-bg); color:#a0aab5; position:fixed; width:260px; z-index:100; border-right:1px solid rgba(255,255,255,0.05); }
        .sidebar-header { padding:24px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .sidebar-header i { font-size:1.4rem; color:var(--primary-light); }
        .sidebar-header h5 { margin:0; color:white; font-weight:700; font-size:1.1rem; }
        .sidebar-user { padding:16px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .sidebar-avatar { width:40px; height:40px; border-radius:50%; background:#3182ce; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; }
        .sidebar-user-info .name { color:white; font-size:0.9rem; font-weight:600; }
        .sidebar-user-info .role { font-size:0.75rem; color:#90cdf4; background:rgba(49,130,206,0.15); padding:2px 8px; border-radius:10px; display:inline-block; margin-top:2px; }
        .sidebar-nav { padding:12px 0; }
        .sidebar-nav a { display:flex; align-items:center; gap:12px; padding:11px 20px; color:#a0aab5; text-decoration:none; font-size:0.9rem; transition:all 0.2s; border-left:3px solid transparent; }
        .sidebar-nav a:hover { background:rgba(255,255,255,0.05); color:white; }
        .sidebar-nav a.active { background:var(--sidebar-active); color:var(--primary-light); border-left-color:var(--primary-light); font-weight:600; }
        .sidebar-nav a i { width:20px; text-align:center; }
        .sidebar-divider { height:1px; background:rgba(255,255,255,0.06); margin:8px 16px; }
        .sidebar-section-label { padding:8px 20px 4px; font-size:0.7rem; text-transform:uppercase; letter-spacing:1.5px; color:#5a6370; font-weight:600; }
        .logout-link { color:#e53e3e !important; }

        .main-content { margin-left:260px; padding:30px; }
        .welcome-header h2 { font-weight:700; color:#2d3748; margin-bottom:4px; }
        
        .section-card { background:white; border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.04); border:1px solid #edf2f7; margin-bottom:24px; }
        
        .status-badge { padding:6px 12px; border-radius:30px; font-size:0.8rem; font-weight:600; }
        .status-PENDING { background:#feebc8; color:#c05621; }
        .status-CONFIRMED { background:#bee3f8; color:#2b6cb0; }
        .status-COMPLETED { background:#c6f6d5; color:#22543d; }
        .status-CANCELLED { background:#fed7d7; color:#c53030; }

        @media (max-width:768px) { .sidebar { position:relative; width:100%; min-height:auto; } .main-content { margin-left:0; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header"><i class="fa-solid fa-tooth"></i><h5>Bác Sĩ C7</h5></div>
        <div class="sidebar-user">
            <div class="sidebar-avatar" th:text="${loggedInUser != null ? loggedInUser.fullName.substring(0,1).toUpperCase() : 'B'}">B</div>
            <div class="sidebar-user-info">
                <div class="name" th:text="${loggedInUser != null ? loggedInUser.fullName : 'Bác Sĩ'}">Bác Sĩ</div>
                <span class="role">Doctor</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-label">Nghiệp Vụ</div>
            <a th:href="@{/doctor/dashboard}" class="active"><i class="fa-solid fa-stethoscope"></i> Bàn Làm Việc</a>
            <a th:href="@{/doctor/medical-records}"><i class="fa-solid fa-notes-medical"></i> Lịch Sử Khám</a>
            <div class="sidebar-divider"></div>
            <a th:href="@{/logout}" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="welcome-header mb-4">
            <h2>Xin chào, Bác Sĩ!</h2>
            <p style="color:#718096;">Danh sách bệnh nhân cần khám trong ngày hôm nay.</p>
        </div>
        
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="section-card" style="padding:0; overflow:hidden;">
            <div style="padding:20px 24px; border-bottom:1px solid #edf2f7; background:#f8fafc;">
                <h5 style="margin:0; font-weight:700;"><i class="fa-solid fa-users text-primary me-2"></i> Danh sách ca khám hôm nay</h5>
            </div>
            
            <div class="table-responsive" style="padding:24px;">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Giờ</th>
                            <th>Bệnh Nhân</th>
                            <th>Dịch Vụ Cần Làm</th>
                            <th>Trạng Thái</th>
                            <th class="text-end">Hành Động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${appointments == null || appointments.isEmpty()}">
                            <td colspan="5" class="text-center py-4 text-muted">Hôm nay chưa có lịch khám nào.</td>
                        </tr>
                        <tr th:each="apt : ${appointments}" th:if="${apt.status != 'CANCELLED'}">
                            <td th:text="${apt.timeSlot}"></td>
                            <td>
                                <strong th:text="${apt.patient != null ? apt.patient.fullName : 'Lỗi/Trống'}"></strong>
                                <br><small class="text-muted" th:text="${apt.patient != null ? apt.patient.gender + ' - ' + apt.patient.phone : ''}"></small>
                            </td>
                            <td th:text="${apt.service != null ? apt.service.name : 'N/A'}"></td>
                            <td><span th:class="'status-badge status-' + ${apt.status}" th:text="${apt.status}"></span></td>
                            <td class="text-end">
                                <a th:if="${apt.status == 'PENDING' || apt.status == 'CONFIRMED'}" 
                                   th:href="@{'/doctor/examine/' + ${apt.id}}" class="btn btn-sm btn-primary" style="background:var(--primary); border:none;">
                                    <i class="fa-solid fa-stethoscope"></i> Bắt đầu khám
                                </a>
                                <a th:if="${apt.status == 'COMPLETED'}" 
                                   th:href="@{'/doctor/examine/' + ${apt.id}}" class="btn btn-sm btn-outline-secondary">
                                    <i class="fa-solid fa-eye"></i> Xem hồ sơ
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
