<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Bệnh Nhân - Admin C7 Smile Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d9b7a; --primary-dark: #0a6e5c; --primary-light: #14b895;
            --sidebar-bg: #1a1d23; --sidebar-active: rgba(13,155,122,0.15);
        }
        body { font-family:'Inter',sans-serif; background:#f4f7fa; margin:0; }
        .sidebar {
            min-height:100vh; background:var(--sidebar-bg); color:#a0aab5;
            position:fixed; width:260px; z-index:100; border-right:1px solid rgba(255,255,255,0.05);
        }
        .sidebar-header { padding:24px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .sidebar-header i { font-size:1.4rem; color:var(--primary-light); }
        .sidebar-header h5 { margin:0; color:white; font-weight:700; font-size:1.1rem; }
        .sidebar-user { padding:16px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .sidebar-avatar { width:40px; height:40px; border-radius:50%; background:#e53e3e; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; }
        .sidebar-user-info .name { color:white; font-size:0.9rem; font-weight:600; }
        .sidebar-user-info .role { font-size:0.75rem; color:#fc8181; background:rgba(229,62,62,0.15); padding:2px 8px; border-radius:10px; display:inline-block; margin-top:2px; }
        .sidebar-nav { padding:12px 0; }
        .sidebar-nav a { display:flex; align-items:center; gap:12px; padding:11px 20px; color:#a0aab5; text-decoration:none; font-size:0.9rem; transition:all 0.2s; border-left:3px solid transparent; }
        .sidebar-nav a:hover { background:rgba(255,255,255,0.05); color:white; }
        .sidebar-nav a.active { background:var(--sidebar-active); color:var(--primary-light); border-left-color:var(--primary-light); font-weight:600; }
        .sidebar-nav a i { width:20px; text-align:center; }
        .sidebar-divider { height:1px; background:rgba(255,255,255,0.06); margin:8px 16px; }
        .sidebar-section-label { padding:8px 20px 4px; font-size:0.7rem; text-transform:uppercase; letter-spacing:1.5px; color:#5a6370; font-weight:600; }
        .logout-link { color:#e53e3e !important; }

        .main-content { margin-left:260px; padding:30px; }
        .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        .page-header h2 { font-weight:700; color:#2d3748; margin:0; }
        
        .section-card { background:white; border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.04); border:1px solid #edf2f7; }
        
        .table { margin-bottom:0; }
        .table th { font-weight:600; color:#4a5568; border-bottom-width:1px; padding:16px; background:#f8fafc; font-size:0.85rem; text-transform:uppercase; letter-spacing:0.5px; }
        .table td { padding:16px; vertical-align:middle; color:#2d3748; border-bottom-color:#edf2f7; }
        
        .btn-action { width:32px; height:32px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; border:none; transition:all 0.2s; color:white; }
        .btn-edit { background:#4299e1; }
        .btn-edit:hover { background:#3182ce; }
        .btn-delete { background:#e53e3e; }
        .btn-delete:hover { background:#c53030; }

        @media (max-width:768px) { .sidebar { position:relative; width:100%; min-height:auto; } .main-content { margin-left:0; } }
    </style>
</head>
<body>
    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar">
        <div class="sidebar-header"><i class="fa-solid fa-tooth"></i><h5>C7 Admin</h5></div>
        <div class="sidebar-user">
            <div class="sidebar-avatar" th:text="${loggedInUser != null ? loggedInUser.fullName.substring(0,1).toUpperCase() : 'A'}">A</div>
            <div class="sidebar-user-info">
                <div class="name" th:text="${loggedInUser != null ? loggedInUser.fullName : 'Admin'}">Admin</div>
                <span class="role">Admin</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-label">Quản lý chính</div>
            <a th:href="@{/admin/dashboard}"><i class="fa-solid fa-chart-line"></i> Tổng Quan</a>
            <a th:href="@{/admin/reports}"><i class="fa-solid fa-chart-pie"></i> Báo Cáo Thống Kê</a>
            <a th:href="@{/admin/services}"><i class="fa-solid fa-tooth"></i> Dịch Vụ</a>
            <a th:href="@{/admin/dentists}"><i class="fa-solid fa-user-doctor"></i> Bác Sĩ</a>
            <a th:href="@{/admin/patients}" class="active"><i class="fa-solid fa-users"></i> Bệnh Nhân</a>
            <a th:href="@{/admin/appointments}"><i class="fa-solid fa-calendar-check"></i> Lịch Hẹn</a>
            <div class="sidebar-divider"></div>
            <a th:href="@{/logout}" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</a>
        </nav>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-content">
        <div class="page-header">
            <h2>Quản Lý Bệnh Nhân</h2>
            <button class="btn btn-primary" style="background:var(--primary); border:none;" data-bs-toggle="modal" data-bs-target="#patientModal">
                <i class="fa-solid fa-plus me-1"></i> Thêm Bệnh Nhân
            </button>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="section-card">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Họ và Tên</th>
                            <th>SĐT</th>
                            <th>Ngày Sinh</th>
                            <th>Giới Tính</th>
                            <th>Tài Khoản Liên Kết</th>
                            <th class="text-end">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${patients == null || patients.isEmpty()}">
                            <td colspan="7" class="text-center py-4 text-muted">Không có dữ liệu bệnh nhân</td>
                        </tr>
                        <tr th:each="p : ${patients}">
                            <td th:text="'#' + ${p.id}"></td>
                            <td class="fw-bold" th:text="${p.fullName}"></td>
                            <td th:text="${p.phone}"></td>
                            <td th:text="${p.dob}"></td>
                            <td th:text="${p.gender}"></td>
                            <td>
                                <span th:if="${p.account != null}" class="badge bg-success">Đã liên kết</span>
                                <span th:if="${p.account == null}" class="badge bg-secondary">Khách vãng lai</span>
                            </td>
                            <td class="text-end">
                                <button class="btn-action btn-edit" 
                                        th:data-id="${p.id}" th:data-name="${p.fullName}" th:data-phone="${p.phone}" 
                                        th:data-dob="${p.dob}" th:data-gender="${p.gender}" th:data-cccd="${p.cccd}"
                                        th:data-address="${p.address}" th:data-notes="${p.medicalHistoryNotes}"
                                        onclick="editPatient(this)">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <a th:href="@{'/admin/patients/delete/' + ${p.id}}" class="btn-action btn-delete" onclick="return confirm('Bạn có chắc chắn muốn xóa hồ sơ này?');">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal fade" id="patientModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="patientForm" th:action="@{/admin/patients/save}" method="post">
                    <input type="hidden" name="id" id="patientId">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">Thêm Bệnh Nhân</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" name="fullName" id="p_fullName" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Số điện thoại</label>
                                <input type="text" name="phone" id="p_phone" class="form-control">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Ngày sinh</label>
                                <input type="date" name="dob" id="p_dob" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Giới tính</label>
                                <select name="gender" id="p_gender" class="form-select">
                                    <option value="Nam">Nam</option>
                                    <option value="Nữ">Nữ</option>
                                    <option value="Khác">Khác</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Số CCCD</label>
                                <input type="text" name="cccd" id="p_cccd" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Địa chỉ</label>
                                <input type="text" name="address" id="p_address" class="form-control">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ghi chú y tế (Dị ứng, bệnh nền...)</label>
                            <textarea name="medicalHistoryNotes" id="p_notes" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary" style="background:var(--primary); border:none;">Lưu Thông Tin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function editPatient(btn) {
            document.getElementById('modalTitle').innerText = 'Cập Nhật Bệnh Nhân';
            document.getElementById('patientId').value = btn.getAttribute('data-id');
            document.getElementById('p_fullName').value = btn.getAttribute('data-name');
            document.getElementById('p_phone').value = btn.getAttribute('data-phone');
            document.getElementById('p_dob').value = btn.getAttribute('data-dob');
            document.getElementById('p_gender').value = btn.getAttribute('data-gender');
            document.getElementById('p_cccd').value = btn.getAttribute('data-cccd');
            document.getElementById('p_address').value = btn.getAttribute('data-address');
            document.getElementById('p_notes').value = btn.getAttribute('data-notes');
            
            var modal = new bootstrap.Modal(document.getElementById('patientModal'));
            modal.show();
        }

        document.getElementById('patientModal').addEventListener('hidden.bs.modal', function () {
            document.getElementById('modalTitle').innerText = 'Thêm Bệnh Nhân';
            document.getElementById('patientForm').reset();
            document.getElementById('patientId').value = '';
        });
    </script>
</body>
</html>
