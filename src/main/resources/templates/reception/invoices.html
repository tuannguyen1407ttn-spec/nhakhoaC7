<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Hóa Đơn - C7 Smile Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0d9b7a; --primary-dark: #0a6e5c; --primary-light: #14b895; --sidebar-bg: #1a1d23; --sidebar-active: rgba(13,155,122,0.15); }
        body { font-family:'Inter',sans-serif; background:#f4f7fa; margin:0; }
        .sidebar { min-height:100vh; background:var(--sidebar-bg); color:#a0aab5; position:fixed; width:260px; z-index:100; border-right:1px solid rgba(255,255,255,0.05); }
        .sidebar-header { padding:24px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .sidebar-header i { font-size:1.4rem; color:var(--primary-light); }
        .sidebar-header h5 { margin:0; color:white; font-weight:700; font-size:1.1rem; }
        .sidebar-user { padding:16px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .sidebar-avatar { width:40px; height:40px; border-radius:50%; background:#805ad5; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; }
        .sidebar-user-info .name { color:white; font-size:0.9rem; font-weight:600; }
        .sidebar-user-info .role { font-size:0.75rem; color:#e9d8fd; background:rgba(128,90,213,0.15); padding:2px 8px; border-radius:10px; display:inline-block; margin-top:2px; }
        .sidebar-nav { padding:12px 0; }
        .sidebar-nav a { display:flex; align-items:center; gap:12px; padding:11px 20px; color:#a0aab5; text-decoration:none; font-size:0.9rem; transition:all 0.2s; border-left:3px solid transparent; }
        .sidebar-nav a:hover { background:rgba(255,255,255,0.05); color:white; }
        .sidebar-nav a.active { background:var(--sidebar-active); color:var(--primary-light); border-left-color:var(--primary-light); font-weight:600; }
        .sidebar-nav a i { width:20px; text-align:center; }
        .sidebar-divider { height:1px; background:rgba(255,255,255,0.06); margin:8px 16px; }
        .sidebar-section-label { padding:8px 20px 4px; font-size:0.7rem; text-transform:uppercase; letter-spacing:1.5px; color:#5a6370; font-weight:600; }
        .logout-link { color:#e53e3e !important; }

        .main-content { margin-left:260px; padding:30px; }
        .page-header { display:flex; align-items:center; gap:15px; margin-bottom:24px; }
        .page-header h2 { font-weight:700; color:#2d3748; margin:0; }
        .section-card { background:white; border-radius:16px; padding:0; box-shadow:0 2px 12px rgba(0,0,0,0.04); border:1px solid #edf2f7; overflow:hidden; }
        
        .table { margin-bottom:0; }
        .table th { font-weight:600; color:#4a5568; border-bottom-width:1px; padding:16px; background:#f8fafc; font-size:0.85rem; text-transform:uppercase; letter-spacing:0.5px; }
        .table td { padding:16px; vertical-align:middle; color:#2d3748; border-bottom-color:#edf2f7; }
        
        .status-badge { padding:6px 12px; border-radius:30px; font-size:0.8rem; font-weight:600; }
        .status-UNPAID { background:#fed7d7; color:#c53030; }
        .status-PARTIALLY_PAID { background:#feebc8; color:#c05621; }
        .status-PAID { background:#c6f6d5; color:#22543d; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header"><i class="fa-solid fa-tooth"></i><h5>Lễ Tân C7</h5></div>
        <div class="sidebar-user">
            <div class="sidebar-avatar" th:text="${loggedInUser != null ? loggedInUser.fullName.substring(0,1).toUpperCase() : 'L'}">L</div>
            <div class="sidebar-user-info">
                <div class="name" th:text="${loggedInUser != null ? loggedInUser.fullName : 'Lễ Tân'}">Lễ Tân</div>
                <span class="role">Reception</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-label">Nghiệp Vụ</div>
            <a th:href="@{/reception/dashboard}"><i class="fa-solid fa-desktop"></i> Bàn Làm Việc</a>
            <a th:href="@{/reception/walk-in}"><i class="fa-solid fa-user-plus"></i> Khách Vãng Lai</a>
            <a th:href="@{/reception/appointments}"><i class="fa-solid fa-calendar-check"></i> Quản Lý Lịch Hẹn</a>
            <div class="sidebar-divider"></div>
            <div class="sidebar-section-label">Thu Ngân</div>
            <a th:href="@{/reception/invoices}" class="active"><i class="fa-solid fa-file-invoice-dollar"></i> Lịch Sử Hóa Đơn</a>
            <div class="sidebar-divider"></div>
            <a th:href="@{/logout}" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="page-header">
            <h2>Lịch Sử Hóa Đơn</h2>
        </div>

        <div class="section-card">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Mã HĐ</th>
                            <th>Ngày Tạo</th>
                            <th>Bệnh Nhân</th>
                            <th>Tổng Tiền</th>
                            <th>Đã Thu</th>
                            <th>Trạng Thái</th>
                            <th class="text-end">Hành Động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${invoices == null || invoices.isEmpty()}">
                            <td colspan="7" class="text-center py-4 text-muted">Chưa có hóa đơn nào.</td>
                        </tr>
                        <tr th:each="inv : ${invoices}">
                            <td th:text="'#' + ${inv.id}"></td>
                            <td th:text="${#temporals.format(inv.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${inv.patient.fullName}"></td>
                            <td class="fw-bold" th:text="${#numbers.formatDecimal(inv.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td class="text-success fw-bold" th:text="${#numbers.formatDecimal(inv.paidAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td><span th:class="'status-badge status-' + ${inv.status}" th:text="${inv.status}"></span></td>
                            <td class="text-end">
                                <a th:href="@{'/reception/invoices/' + ${inv.id}}" class="btn btn-sm btn-outline-secondary border">
                                    <i class="fa-solid fa-eye"></i> Xem / Thu thêm
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
