<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!-- Includes same head & styling as Dashboard -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiếp Nhận Vãng Lai - Lễ Tân C7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0d9b7a; --primary-dark: #0a6e5c; --primary-light: #14b895; --sidebar-bg: #1a1d23; --sidebar-active: rgba(13,155,122,0.15); }
        body { font-family:'Inter',sans-serif; background:#f4f7fa; margin:0; }
        .sidebar { min-height:100vh; background:var(--sidebar-bg); color:#a0aab5; position:fixed; width:260px; z-index:100; border-right:1px solid rgba(255,255,255,0.05); }
        .sidebar-header { padding:24px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .sidebar-header i { font-size:1.4rem; color:var(--primary-light); }
        .sidebar-header h5 { margin:0; color:white; font-weight:700; font-size:1.1rem; }
        .sidebar-user { padding:16px 20px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .sidebar-avatar { width:40px; height:40px; border-radius:50%; background:#805ad5; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; }
        .sidebar-user-info .name { color:white; font-size:0.9rem; font-weight:600; }
        .sidebar-user-info .role { font-size:0.75rem; color:#e9d8fd; background:rgba(128,90,213,0.15); padding:2px 8px; border-radius:10px; display:inline-block; margin-top:2px; }
        .sidebar-nav { padding:12px 0; }
        .sidebar-nav a { display:flex; align-items:center; gap:12px; padding:11px 20px; color:#a0aab5; text-decoration:none; font-size:0.9rem; transition:all 0.2s; border-left:3px solid transparent; }
        .sidebar-nav a:hover { background:rgba(255,255,255,0.05); color:white; }
        .sidebar-nav a.active { background:var(--sidebar-active); color:var(--primary-light); border-left-color:var(--primary-light); font-weight:600; }
        .sidebar-nav a i { width:20px; text-align:center; }
        .sidebar-divider { height:1px; background:rgba(255,255,255,0.06); margin:8px 16px; }
        .sidebar-section-label { padding:8px 20px 4px; font-size:0.7rem; text-transform:uppercase; letter-spacing:1.5px; color:#5a6370; font-weight:600; }
        .logout-link { color:#e53e3e !important; }
        .main-content { margin-left:260px; padding:30px; }
        .page-header h2 { font-weight:700; color:#2d3748; margin-bottom:4px; }
        .section-card { background:white; border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,0.04); border:1px solid #edf2f7; margin-bottom:24px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header"><i class="fa-solid fa-tooth"></i><h5>Lễ Tân C7</h5></div>
        <div class="sidebar-user">
            <div class="sidebar-avatar" th:text="${loggedInUser != null ? loggedInUser.fullName.substring(0,1).toUpperCase() : 'L'}">L</div>
            <div class="sidebar-user-info">
                <div class="name" th:text="${loggedInUser != null ? loggedInUser.fullName : 'Lễ Tân'}">Lễ Tân</div>
                <span class="role">Reception</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-label">Nghiệp Vụ</div>
            <a th:href="@{/reception/dashboard}"><i class="fa-solid fa-desktop"></i> Bàn Làm Việc</a>
            <a th:href="@{/reception/walk-in}" class="active"><i class="fa-solid fa-user-plus"></i> Khách Vãng Lai</a>
            <a th:href="@{/reception/appointments}"><i class="fa-solid fa-calendar-check"></i> Quản Lý Lịch Hẹn</a>
            <div class="sidebar-divider"></div>
            <div class="sidebar-section-label">Thu Ngân</div>
            <a th:href="@{/reception/invoices}"><i class="fa-solid fa-file-invoice-dollar"></i> Lịch Sử Hóa Đơn</a>
            <div class="sidebar-divider"></div>
            <a th:href="@{/logout}" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="page-header mb-4">
            <h2>Tiếp Nhận Khách Vãng Lai</h2>
            <p style="color:#718096;">Tạo nhanh hồ sơ và xếp lịch ngay cho khách hàng tới trực tiếp.</p>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="section-card">
            <form th:action="@{/reception/walk-in/save}" method="post">
                <div class="row">
                    <div class="col-md-6 border-end pe-4">
                        <h5 class="mb-4 text-primary"><i class="fa-solid fa-user me-2"></i>Thông tin bệnh nhân</h5>
                        
                        <ul class="nav nav-pills mb-3" id="patientTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="new-tab" data-bs-toggle="pill" data-bs-target="#new-patient" type="button" role="tab" onclick="document.getElementById('existingPatientId').value=''">Tạo Mới (Vãng Lai)</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="existing-tab" data-bs-toggle="pill" data-bs-target="#existing-patient" type="button" role="tab">Bệnh Nhân Cũ</button>
                            </li>
                        </ul>
                        
                        <div class="tab-content" id="patientTabContent">
                            <!-- Tạo mới -->
                            <div class="tab-pane fade show active" id="new-patient" role="tabpanel">
                                <div class="mb-3">
                                    <label class="form-label">Họ và tên <span class="text-danger">*</span></label>
                                    <input type="text" name="fullName" class="form-control" placeholder="Nguyễn Văn A">
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">SĐT</label>
                                        <input type="text" name="phone" class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Giới tính</label>
                                        <select name="gender" class="form-select">
                                            <option value="Nam">Nam</option><option value="Nữ">Nữ</option><option value="Khác">Khác</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Ngày sinh</label>
                                    <input type="date" name="dob" class="form-control">
                                </div>
                            </div>
                            
                            <!-- Bệnh nhân cũ -->
                            <div class="tab-pane fade" id="existing-patient" role="tabpanel">
                                <div class="mb-3">
                                    <label class="form-label">Chọn từ danh sách có sẵn (Tìm theo SĐT/Tên)</label>
                                    <select name="existingPatientId" id="existingPatientId" class="form-select">
                                        <option value="">-- Chọn bệnh nhân --</option>
                                        <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.fullName + ' - ' + (p.phone != null ? p.phone : 'No Phone')}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6 ps-4">
                        <h5 class="mb-4 text-primary"><i class="fa-solid fa-calendar-plus me-2"></i>Thông tin lịch hẹn</h5>
                        
                        <div class="mb-3">
                            <label class="form-label">Dịch vụ <span class="text-danger">*</span></label>
                            <select name="serviceId" class="form-select" required>
                                <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}"></option>
                            </select>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Ngày khám <span class="text-danger">*</span></label>
                                <input type="date" name="appointmentDate" class="form-control" required th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Buổi <span class="text-danger">*</span></label>
                                <select name="timeSlot" class="form-select" required>
                                    <option value="Sáng (08:00 - 11:30)">Sáng (08:00 - 11:30)</option>
                                    <option value="Chiều (13:00 - 17:00)">Chiều (13:00 - 17:00)</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Ghi chú cho bác sĩ</label>
                            <textarea name="notes" class="form-control" rows="2"></textarea>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg" style="background:var(--primary); border:none;"><i class="fa-solid fa-check-circle me-2"></i> Tạo Lịch Hẹn Walk-in</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Set min date to today
        document.querySelector('input[name="appointmentDate"]').min = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
